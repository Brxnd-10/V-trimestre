<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="assets/img/favicon.png" type="image/x-icon">
  <link rel="stylesheet" href="assets/css/style.css">
  <title>Recuperar Contraseña</title>
</head>
<body>
  <!-- Preloader -->
  <div class="preloader" id="preloader">
    <div class="spinner">Cargando...</div>
  </div>

  <header>
    <h1>Recuperar Contraseña</h1>
    <button class="toggle-button" id="toggle-button">☰</button>
    <nav>
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="#">Acerca De</a></li>
        <li><a href="#">Contactanos</a></li>
        <li><a href="index.html">Iniciar Sesión</a></li>
      </ul>
    </nav>
  </header>

  <div class="login-container">
    <form action="/reset-password" method="POST">
      <div class="validation-message" id="validation-message"></div>
      
      <p>Ingresa tu correo electrónico o usuario para enviarte las instrucciones de restablecimiento.</p>
      
      <label for="email">Correo o Usuario:</label>
      <input type="email" id="email" name="email" placeholder="Correo electrónico" required>

      <button type="submit">Enviar enlace de recuperación</button>
    </form>
  </div>

  <footer>
    <p>&copy; 2024 Your Company. All rights reserved.</p>
  </footer>

  <script src="assets/js/main.js"></script>
</body>
</html>
