<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="assets/img/favicon.png" type="image/x-icon">
<link rel="stylesheet" href="assets/css/style.css">
<title>Register</title>
</head>
<body>
<!-- Preloader -->
<div class="preloader" id="preloader">
<div class="spinner">Cargando...</div>
</div>
<!-- Header -->
<header>
<h1>Register</h1>
<button class="toggle-button" id="toggle-button"></button>
<nav>
<ul>
<li><a href="index.html">Login</a></li>
<li><a href="register.html" class="active">Register</a></li>
<li><a href="#">Contact</a></li>
</ul>
</nav>
</header>
<div class="login-container">
<form action="/register" method="POST">
<div class="validation-message" id="validation-message"></div>
<label for="fullname">Full Name:</label>
<input type="text" id="fullname" name="fullname" placeholder="Full Name" required>

<label for="email">Email:</label>
<input type="email" id="email" name="email" placeholder="Email" required>

<label for="username">Username:</label>
<input type="text" id="username" name="username" pattern="^[a-zA-Z0-9_]{4,20}$"
title="Debe tener 4-20 caracteres, solo letras, números y guiones bajos"
placeholder="Username" required>

<label for="password">Password:</label>
<input type="password" id="password" pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).+$"
title="Debe tener al menos una letra minúscula, una letra mayúscula y un número"
placeholder="Password"
name="password" required>

<button type="submit">Register</button>
</form>
</div>
<footer>
<p>&copy; 2024 Your Company. All rights reserved.</p>
</footer>

<script src="assets/js/main.js"></script>
</body>
</html>
