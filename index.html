<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="assets/img/favicon.png" type="image/x-icon">
<link rel="stylesheet" href="assets/css/style.css">
<title>Login</title>
</head>
<body>
<!-- Preloader -->
<div class="preloader" id="preloader">
<div class="spinner">Cargando...</div>
</div>
<header>
<h1>Login </h1>
<button class="toggle-button" id="toggle-button">☰</button>
<nav>
<ul>
<li><a href="#">Inicio</a></li>
<li><a href="#">Acerca De</a></li>
<li><a href="#">Contactanos</a></li>
</ul>
</nav>
</header>
<div class="login-container">
<form action="/login" method="POST">
<div class="validation-message" id="validation-message"></div>
<label for="username">Usuario:</label>
<input type="text" id="username" name="username" pattern="^ $[a-zA-7	heta-9\_]\{4,2	heta\}\Phi^{\prime\prime}$
title="Debe tener 4-20 caracteres, solo letras, números y guiones bajos"
placeholder="Username" required>
<label for="password">Contraseña:</label>
<input type="password" id="password" pattern $=^{m\wedge}(?=.^{*}[a-z])(?=.^{*}[A-z])(?=.^{*}ackslash d).+\$^{n}$
title="Debe tener al menos una letra minúscula, una letra mayúscula y un número"
placeholder="Password"
name="password" required>
<button type="submit">Login</button>
</form>
</div>
<footer>
<p>&copy; 2024 Your Company. All rights reserved.</p>
</footer>
<script src="assets/js/main.js"></script>
</body>
</html>
